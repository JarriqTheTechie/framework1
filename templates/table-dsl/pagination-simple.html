<nav aria-label="Simple pagination" class="mt-3">
    <div class="d-flex align-items-center justify-content-between">
        <div class="pagination-info">
            Showing {{ data|length }} items
        </div>
        <ul class="pagination mb-0">
            <li class="page-item {% if not has_prev %}disabled{% endif %}">
                <a class="page-link"
                   href="{{ request.clean_table_url(table_name, {'page': current_page - 1}) if has_prev else '#' }}"
                   {% if not has_prev %}tabindex="-1"{% endif %}>
                    Previous
                </a>
            </li>
            <li class="page-item {% if not has_next %}disabled{% endif %}">
                <a class="page-link"
                   href="{{ request.clean_table_url(table_name, {'page': current_page + 1}) if has_next else '#' }}"
                   {% if not has_next %}tabindex="-1"{% endif %}>
                    Next
                </a>
            </li>
        </ul>
    </div>
</nav>
